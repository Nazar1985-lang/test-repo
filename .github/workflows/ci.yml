name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pre-commit

      - name: Run pre-commit
        run: python -m pre_commit run --all-files

      - name: Run tests with 100% coverage
        run: python -m pytest --cov=. --cov-branch --cov-fail-under=100

      - name: Smoke test
        run: python main.py
